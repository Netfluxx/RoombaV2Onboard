amcl:
  ros__parameters:
    use_sim_time: False
    odom_frame_id: "odom"
    base_frame_id: "base_link"
    global_frame_id: "map"
    scan_topic: "scan"
    min_particles: 500
    max_particles: 2000
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.1
    resample_interval: 1
    update_min_d: 0.2
    update_min_a: 0.2
    laser_min_range: 0.0
    laser_max_range: 12.0
    laser_max_beams: 100
    transform_tolerance: 0.5
    recovery_alpha_slow: 0.005
    recovery_alpha_fast: 0.1
    tf_broadcast: True
    map_type: "occupancy"
