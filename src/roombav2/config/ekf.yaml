frequency: 30

sensor_timeout: 0.1
two_d_mode: true

odom_frame: odom
base_link_frame: base_link
world_frame: odom

odom0: /odom  # Topic for odometry data
odom0_config: [false, false, false, true, true, true,  # Position data is ignored
               false, false, false, true, true, true,  # Orientation and velocities are used
               false, false, false]


use_control: false  # If using a control input (velocity commands)
