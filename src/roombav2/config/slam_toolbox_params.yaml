# slam_toolbox_params.yaml
slam_toolbox:
  ros__parameters:
    use_sim_time: false

    #input topics
    scan_topic: /scan
    map_topic: /map
    odom_topic: /odom
    base_frame: base_link
    map_frame: map
    odom_frame: odom
    scan_frame: lidar_link
    scan_queue_size: 10

    #SLAM specific parameters
    minimum_time_interval: 0.1
    transform_publish_period: 0.05
    transform_timeout: 0.2 #needec ?
    map_update_interval: 5.0

    #Pose graph optimization parameters
    mode: "mapping"
    max_laser_range: 12.0
    min_laser_range: 0.2
    resolution: 0.05


    #LiDAR parameters
    resolution: 0.05
    minimum_travel_distance: 0.2
    minimum_travel_heading: 0.15

    #Optimizer settings
    max_optimizer_iterations: 30

    #map save/load
    map_file_name: "roombav2_map"

    #transforms
    publish_map_to_odom: true
    publish_tf: true
    publish_pose: true #needed?


    # Other parameters
    enable_imu: false
    queue_size: 50

